[project]
name = "simplified-training-optimizer"
version = "0.1.0"
description = "Minimal NOOA training optimizer"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "holistictraceanalysis>=0.5.0",
    "nooa",
    "pandas<3",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
workflow = "simplified.workflow:main"
instrumentation-knowledge = "simplified.knowledge:main"

[tool.setuptools.package-data]
simplified = ["instrumentation_wiki/**/*.md", "instrumentation_wiki/**/*.yaml", "instrumentation_wiki/**/*.json"]

[dependency-groups]
dev = [
    "pytest>=9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["simplified"]
package-dir = { simplified = "." }
